<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅館管家 System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="app">
        <aside class="sidebar">
            <div class="brand">
                <img src="./assets/logo.jpg" alt="Logo"
                    style="width: 32px; height: 32px; border-radius: 6px; box-shadow: var(--metal-shadow);">
                <h1>旅館管家</h1>
            </div>
            <nav>
                <div
                    style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin: 1rem 0 0.5rem 1rem; letter-spacing: 1px;">
                    Operations</div>
                <a href="#/" class="nav-item active" data-path="/">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>儀表板</span>
                </a>
                <a href="#/frontdesk" class="nav-item" data-path="/frontdesk">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>櫃台作業</span>
                </a>
                <a href="#/housekeeping" class="nav-item" data-path="/housekeeping">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 20h20"></path>
                        <path d="M2 14h20"></path>
                        <path d="M6 14c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
                        <path d="M4 20v-6"></path>
                        <path d="M20 20v-6"></path>
                    </svg>
                    <span>房務管理</span>
                </a>
                <a href="#/booking" class="nav-item" data-path="/booking">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>新增預定</span>
                </a>
                <a href="#/orders" class="nav-item" data-path="/orders">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>訂單管理</span>
                </a>

                <div
                    style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin: 1.5rem 0 0.5rem 1rem; letter-spacing: 1px;">
                    Management</div>
                <a href="#/reports" class="nav-item" data-path="/reports">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                        <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                    </svg>
                    <span>報表中心</span>
                </a>
                <a href="#/projects" class="nav-item" data-path="/projects">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M2 12h20M17 5l-5-5-5 5M12 2v20" />
                    </svg>
                    <span>專案設定</span>
                </a>
                <a href="#/dates" class="nav-item" data-path="/dates">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>日期定義</span>
                </a>
                <a href="#/settings" class="nav-item" data-path="/settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    <span>設定</span>
                </a>
            </nav>
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <h2 id="page-title" style="font-weight: 500; font-size: 1.25rem;">儀表板</h2>
                <div class="user-profile" style="display:flex; align-items:center; gap:0.5rem;">
                    <span style="font-size:0.9rem; color:var(--text-secondary);">Welcome,</span>
                    <span style="font-weight:600;">Admin</span>
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Views will be injected here -->
            </div>
        </main>
    </div>

    <script type="module" src="./js/app.js?v=1735200000"></script>
</body>

</html>
